<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vantage Store</title>
  
  <!-- Telegram Web App JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      --card-bg: rgba(25, 22, 18, 0.65);
      --accent: #ffffff;
      --accent-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: #fff;
      padding: 16px;
      padding-bottom: 100px;
      min-height: 100vh;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      margin-bottom: 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .cart-badge-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-highlight);
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Product Grid */
    .catalog {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      will-change: transform;
      transform: translateZ(0);
    }

    .product-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .product-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #f0f0f0;
    }

    .product-price {
      font-size: 0.85rem;
      color: var(--accent-muted);
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .add-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Sticky Bottom Checkout Bar */
    .checkout-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-highlight);
      border-radius: 24px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .checkout-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 22px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .checkout-btn:active {
      transform: scale(0.96);
    }

    /* Cart Modal Drawer */
    .cart-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 200;
      padding: 20px;
      flex-direction: column;
      justify-content: flex-end;
    }

    .cart-content {
      background: rgba(20, 20, 25, 0.95);
      border: 1px solid var(--glass-highlight);
      border-radius: 28px;
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--accent-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-title">VANTAGE</div>
    <button class="cart-badge-btn" onclick="toggleCart()">
      Cart (<span id="cart-count">0</span>)
    </button>
  </header>

  <!-- Product Catalog -->
  <main class="catalog" id="catalog"></main>

  <!-- Sticky Bottom Bar -->
  <div class="checkout-bar">
    <div>
      <div style="font-size: 0.75rem; color: var(--accent-muted);">TOTAL</div>
      <div style="font-size: 1.1rem; font-weight: 700;" id="total-price">$0</div>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">Checkout</button>
  </div>

  <!-- Cart Modal -->
  <div class="cart-modal" id="cart-modal">
    <div class="cart-content">
      <div class="cart-header">
        <h3>Your Cart</h3>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div id="cart-items-list"></div>
    </div>
  </div>

  <!-- Logic Script -->
  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const products = [
      { id: 1, name: "Heavyweight Hoodie", price: 120, img: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=400" },
      { id: 2, name: "Oversized Tee", price: 65, img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400" },
      { id: 3, name: "Tactical Cargo Pants", price: 140, img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400" },
      { id: 4, name: "Obsidian Cap", price: 45, img: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400" }
    ];

    let cart = {};

    function renderCatalog() {
      const catalogEl = document.getElementById('catalog');
      catalogEl.innerHTML = products.map(p => `
        <div class="product-card">
          <img src="${p.img}" class="product-img" alt="${p.name}" />
          <div>
            <div class="product-title">${p.name}</div>
            <div class="product-price">$${p.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart(${p.id})">+ Add</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    }

    function updateQuantity(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
    }

    function updateCartUI() {
      let count = 0;
      let total = 0;
      const itemsList = document.getElementById('cart-items-list');
      itemsList.innerHTML = '';

      Object.keys(cart).forEach(id => {
        const product = products.find(p => p.id == id);
        const qty = cart[id];
        count += qty;
        total += product.price * qty;

        itemsList.innerHTML += `
          <div class="cart-item">
            <div>
              <div style="font-weight: 600; font-size: 0.9rem;">${product.name}</div>
              <div style="font-size: 0.8rem; color: var(--accent-muted);">$${product.price} each</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="updateQuantity(${id}, -1)">-</button>
              <span>${qty}</span>
              <button class="qty-btn" onclick="updateQuantity(${id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cart-count').innerText = count;
      document.getElementById('total-price').innerText = `$${total}`;
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function submitOrder() {
      const items = Object.keys(cart).map(id => {
        const p = products.find(prod => prod.id == id);
        return { name: p.name, quantity: cart[id], price: p.price };
      });

      if (items.length === 0) {
        tg.showAlert("Your cart is empty!");
        return;
      }

      const orderData = {
        items: items,
        total: Object.keys(cart).reduce((sum, id) => sum + (products.find(p => p.id == id).price * cart[id]), 0)
      };

      tg.sendData(JSON.stringify(orderData));
    }

    renderCatalog();
  </script>
</body>
</html>
